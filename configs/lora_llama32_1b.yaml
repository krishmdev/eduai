# Fallback config for the 1B model (about 3x faster). Same data and settings otherwise.
# The model path is the pinned snapshot that `make models-llm` downloads.
model: .models/hub/models--mlx-community--Llama-3.2-1B-Instruct-4bit/snapshots/08231374eeacb049a0eade7922910865b8fce912
train: true
fine_tune_type: lora
data: data/sft
seed: 7
num_layers: 16
batch_size: 4
iters: 600            # about 0.8 epoch of 3,000 examples
learning_rate: 2.0e-5
val_batches: 25
steps_per_report: 10
steps_per_eval: 100
save_every: 100
adapter_path: adapters/llama32-1b-eduai
max_seq_length: 1024
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.05
